services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: ./
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - app_docs:/src/data/docs
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  app_docs:
