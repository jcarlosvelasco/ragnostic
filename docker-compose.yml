services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: ./
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - HF_HUB_DISABLE_XET=1
      - FASTEMBED_CACHE_PATH=/cache/fastembed

    ports:
      - "8000:8000"
    volumes:
      - app_docs:/src/data/docs
      - model_cache:/cache

    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  app_docs:
  model_cache:
