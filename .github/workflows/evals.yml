name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.18"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: ty
        run: uv run ty check

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.18"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: ruff
        run: uv run ruff check

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start Qdrant
        run: docker compose up -d qdrant

      - name: Start API with mock LLM
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
        env:
          QDRANT_URL: http://localhost:6333
          LLM_PROVIDER: mock

      - name: Load documents
        run: curl -sf -X POST http://localhost:8000/load_docs

      - name: Smoke test
        run: |
          curl -sf -X POST http://localhost:8000/retrieve \
            -H "Content-Type: application/json" \
            -d '{"query": "What is LangChain?"}' \
            | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'answer' in data
          assert 'context' in data
          assert len(data['context']) > 0
          print('✅ Smoke test passed')
          "
